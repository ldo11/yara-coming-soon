<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara Artisan Bakery - Processing Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-content {
            text-align: center;
            padding: 4rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .page-content h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        .page-content p {
            color: var(--color-text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .video-container {
            max-width: 380px;
            width: 100%;
            aspect-ratio: 9 / 16;
            margin: 0 auto 2rem;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            background: #000;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .nav-btn {
            display: inline-block;
            text-decoration: none;
            color: #d4a373;
            font-weight: 600;
            border: 2px solid #d4a373;
            padding: 0.6rem 1.4rem;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .nav-btn:hover {
            background: #d4a373;
            color: #fff;
        }
        .nav-btn.primary {
            background: var(--color-red-dark);
            border-color: var(--color-red-dark);
            color: #fff;
        }
        .nav-btn.primary:hover {
            background: var(--color-red);
            border-color: var(--color-red);
        }
    </style>
</head>
<body>
    <div class="page-content">
        <h1>Processing Video</h1>
        <p>Watch how we handcraft and process our artisan goods!</p>
        
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/A6iQEqGkUHM" 
                title="Yara Artisan Bakery - Processing Video" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="button-group">
            <a href="https://youtube.com/shorts/A6iQEqGkUHM" target="_blank" rel="noopener noreferrer" class="nav-btn primary">Open in YouTube &#8599;</a>
            <a href="index.html" class="nav-btn">&larr; Back to Home</a>
        </div>
    </div>
</body>
</html>
